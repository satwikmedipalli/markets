[project]
name = "pricedin"
version = "0.1.0"
description = "Which stocks move with prediction-market odds, by how much, and which market reprices first."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
pricedin = "pricedin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
