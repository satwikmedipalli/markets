# Contract universe. Chosen 2026-11-26 by traded volume (data/discovery.csv) and economic
# relevance, BEFORE any stock data was pulled. Each family lists the assets tested against it.
#
# assets: ticker -> sector control ETF (null = market control only; SPY itself gets no controls).
# rule_clarity: clear | ambiguous (module 3). Ambiguous contracts are still estimated but flagged.

market_proxy: SPY

families:
  - id: fomc
    kind: fomc
    label: "FOMC decision days"
    type: fed
    series: [FEDDECISION, KXFEDDECISION]
    rule_clarity: clear
    question: "How do stocks move with the odds of a cut at the NEXT meeting, during the statement and press conference?"
    assets: {SPY: null, KRE: null, XLF: null, XHB: null, TLT: null, IWM: null, JPM: XLF}

  - id: fedchair-warsh
    kind: unscheduled
    source: kalshi
